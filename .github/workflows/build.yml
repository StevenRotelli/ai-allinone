name: build image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'src/**', 'pins.json', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'extra tag to publish (e.g. v1)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io

    steps:
      # A GitHub-hosted runner has ~14 GB free on /. This image is CUDA devel +
      # torch + onnxruntime-gpu + DFL and will not fit. Reclaiming the
      # preinstalled toolchains buys roughly 25-30 GB and is the difference
      # between a build and a "no space left on device" at 90%.
      - name: reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-allinone
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache keeps rebuild times sane; mode=max caches intermediate
          # layers too, which matters because the torch layer is enormous.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: summary
        run: |
          echo "### pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          df -h / | tail -1 >> $GITHUB_STEP_SUMMARY
